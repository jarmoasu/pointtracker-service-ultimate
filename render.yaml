services:
  - type: web
    name: pointtracker-service
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: sqlite
      mountPath: /var/sqlite
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLAIM_CODE
        sync: false
      - key: SESSION_SECRET_HEX
        sync: false
      - key: STREAM_ID
        value: main
      - key: NODE_ENV
        value: production
